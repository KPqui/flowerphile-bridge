; Flowerphile sensor bridge. Built by GitHub Actions (.github/workflows/build.yml).
; Target: M5Stack AtomS3 Lite (ESP32-S3FN8, 8 MB flash, no PSRAM).
; For the older ATOM Lite (ESP32-PICO-D4) the board, LED pin (27) and button pin (39) differ.

[env:atoms3lite]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = m5stack-atoms3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFW_VERSION=\"${sysenv.FW_VERSION}\"
lib_deps =
  h2zero/NimBLE-Arduino@2.5.0
  bblanchon/ArduinoJson@7.2.1
